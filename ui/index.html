<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse our product catalogue and send an enquiry." />
    <meta name="theme-color" content="#1f5c4a" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%231f5c4a'/%3E%3Cpath d='M9 13.5 11.2 9h17.6l2.2 4.5H9Z' fill='white'/%3E%3Cpath d='M9 13.5h22v1.2a2.75 2.75 0 0 1-5.5 0 2.75 2.75 0 0 1-5.5 0 2.75 2.75 0 0 1-5.5 0 2.75 2.75 0 0 1-5.5 0v-1.2Z' fill='%23b8622d'/%3E%3Cpath d='M11 19.5V30a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V19.5' fill='none' stroke='white' stroke-width='2.2'/%3E%3Crect x='17.5' y='23' width='5' height='8' rx='1' fill='white'/%3E%3C/svg%3E"
    />
    <title>Storefront</title>
    <script>
      // Resolve the theme before first paint to avoid a light/dark flash: saved choice, else OS preference.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
